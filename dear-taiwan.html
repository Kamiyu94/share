<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>需要密碼</title>
<style>
  :root{ --navy:#142356; --navy2:#21478C; --gold:#FFBF00; --tint:#eef0f7; --danger:#ff6b6b; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--navy); padding:24px;
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    color:#fff;
  }
  .card{ width:100%; max-width:460px; text-align:center; }
  .badge{
    display:inline-block; background:var(--gold); color:var(--navy);
    font-weight:900; letter-spacing:2px; font-size:13px;
    padding:5px 16px; border-radius:999px; margin-bottom:26px;
  }
  h1{ font-size:27px; font-weight:900; letter-spacing:1px; line-height:1.4; margin-bottom:10px; }
  .sub{ font-size:15px; color:#aeb7d2; line-height:1.8; margin-bottom:30px; }
  .rule{ width:70px; height:6px; background:var(--gold); border-radius:4px; margin:0 auto 30px; }
  .row{ display:flex; gap:10px; }
  .field{ flex:1; min-width:0; position:relative; }
  input{
    width:100%; font-size:18px; padding:14px 58px 14px 16px; border-radius:10px;
    border:2px solid transparent; background:#fff; color:var(--navy);
    font-family:inherit; font-weight:700; outline:none;
  }
  /* 用 CSS 遮蔽而非 type=password —— password 欄位會讓中文輸入法無法選字 */
  input.mask{ -webkit-text-security:disc; text-security:disc; }
  input:focus{ border-color:var(--gold); }
  #eye{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    background:none; border:none; padding:6px 8px; cursor:pointer;
    font-size:13px; font-weight:800; color:var(--navy2); font-family:inherit;
  }
  button{
    background:var(--gold); color:var(--navy); border:none; border-radius:10px;
    font-size:17px; font-weight:900; padding:14px 26px; cursor:pointer;
    font-family:inherit; white-space:nowrap;
  }
  button:disabled{ opacity:.55; cursor:wait; }
  .hint{ margin-top:12px; font-size:13.5px; color:#8b95b5; line-height:1.7; }
  .msg{ margin-top:18px; font-size:15px; min-height:24px; font-weight:700; }
  .msg.err{ color:var(--danger); }
  .msg.busy{ color:var(--gold); }
  .foot{ margin-top:34px; font-size:13px; color:#7c86a6; line-height:1.75; }
</style>
</head>
<body>
<div class="card">
  <span class="badge">受保護的文件</span>
  <h1>小令 ×《給台灣的情書》<br>整合推估表</h1>
  <div class="rule"></div>
  <div class="sub">本文件已加密，請輸入密碼閱讀。</div>
  <div class="row">
    <div class="field">
      <input id="pw" type="text" class="mask" placeholder="請輸入密碼" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button id="eye" type="button" title="顯示／隱藏">顯示</button>
    </div>
    <button id="go">解鎖</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="hint">密碼含中文，可直接切換輸入法輸入，或複製貼上。<br>前後空白會自動忽略。</div>
  <div class="foot">
    內容以 AES-256-GCM 加密，金鑰由密碼經 PBKDF2-SHA256（600,000 次迭代）派生。<br>
    解密完全在你的瀏覽器內完成，密碼不會傳送到任何伺服器。
  </div>
</div>

const ITER = 600000;

const $pw = document.getElementById('pw');
const $go = document.getElementById('go');
const $msg = document.getElementById('msg');

function b64ToBytes(b64){
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function unlock(){
  // 與產生端一致：去頭尾空白 + NFC 正規化（不同輸入法／OS 可能產生不同 Unicode 組合形式）
  const pw = $pw.value.trim().normalize('NFC');
  if (!pw) { $msg.className='msg err'; $msg.textContent='請輸入密碼'; return; }
  if (!window.crypto || !window.crypto.subtle) {
    $msg.className='msg err';
    $msg.textContent='此瀏覽器不支援解密（需 HTTPS 環境）';
    return;
  }
  $go.disabled = true;
  $msg.className='msg busy';
  $msg.textContent='解密中…';
  await new Promise(r => setTimeout(r, 30));

  try {
    const raw  = b64ToBytes(PAYLOAD);
    const salt = raw.slice(0, 16);
    const iv   = raw.slice(16, 28);
    const data = raw.slice(28);

    const baseKey = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256' },
      baseKey,
      { name:'AES-GCM', length:256 },
      false,
      ['decrypt']
    );
    const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, data);
    const html = new TextDecoder().decode(plain);

    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    $go.disabled = false;
    $msg.className='msg err';
    $msg.textContent='密碼錯誤';
    $pw.select();
  }
}

const $eye = document.getElementById('eye');
$eye.addEventListener('click', () => {
  const masked = $pw.classList.toggle('mask');
  $eye.textContent = masked ? '顯示' : '隱藏';
  $pw.focus();
});

$go.addEventListener('click', unlock);
// isComposing：輸入法組字中按 Enter 是在選字，不該觸發送出
$pw.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) unlock();
});
$pw.focus();
</script>
